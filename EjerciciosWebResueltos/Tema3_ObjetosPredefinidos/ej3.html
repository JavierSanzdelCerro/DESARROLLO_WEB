<!DOCTYPE html>
<!--
  TEMA 3 · EJERCICIO 3  (Ejercicios de arrays)
  ENUNCIADO:
  Dado el siguiente array: [4,0,3,4,7,3,5,8,1,8,8,0,2,3,1,2,5,7,3,2,5,1]. Genera un nuevo array con los elementos originales sin repetir y ordenado.
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tema 3 - Ejercicio 3</title>
</head>

<body>
    <script>
        let numeros = [4, 0, 3, 4, 7, 3, 5, 8, 1, 8, 8, 0, 2, 3, 1, 2, 5, 7, 3, 2, 5, 1];

        // slice() sin parámetros devuelve una COPIA del array; así sort() no desordena el original
        let ordenado = numeros.slice();
        // sort() ordena como TEXTO ("10" iría antes que "2"), pero aquí todos son de 1 cifra y sale bien
        ordenado.sort();

        // Al estar ordenado, los repetidos quedan JUNTOS: [0,0,1,1,1,2...]
        // Basta con añadir cada número solo si es distinto del anterior
        let sinRepetir = [];
        for (let i = 0; i < ordenado.length; i++) {
            if (i === 0 || ordenado[i] !== ordenado[i - 1]) {
                sinRepetir.push(ordenado[i]);
            }
        }

        document.write("Array original: " + numeros.join(" ") + "<br><br>");
        document.write("Sin repetir y ordenado: " + sinRepetir.join(" "));
    </script>
</body>

</html>
