<!DOCTYPE html>
<!--
  TEMA 3 · EJERCICIO 13  (Ejercicios de fechas — Usa objetos Date)
  ENUNCIADO:
  Crea un script que cuando le pases un objeto de tipo Date genere una cadena con el formato: Día de la semana, dd de mm de aaaa, es decir, jueves, 26 de noviembre de 2015.
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tema 3 - Ejercicio 13</title>
</head>

<body>
    <form>
        <br>
        <p>Inserte la fecha:</p>
        Día: <input type="text" id="dia" size="1"> Mes: <input type="text" id="mes" size="1"> Año: <input type="text" id="anyo" size="2"><br><br>
        <input type="submit" value="Enviar" onclick="obtenerFecha(); return false;"><br><br>
        <p id="result"></p>
    </form>

    <script>
        // Recibe un objeto Date y devuelve el texto con el formato pedido
        function formatearFecha(fecha) {
            // Arrays de nombres: la posición coincide con lo que devuelve getMonth() / getDay()
            let nomMeses = ["enero", "febrero", "marzo", "abril", "mayo", "junio",
                "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
            // getDay() devuelve 0 = DOMINGO, 1 = lunes... 6 = sábado (¡la semana empieza en domingo!)
            let nomDias = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];

            return nomDias[fecha.getDay()] + ", " + fecha.getDate() + " de " + nomMeses[fecha.getMonth()] + " de " + fecha.getFullYear();
        }

        function obtenerFecha() {
            let dia = document.getElementById("dia").value;
            let mes = document.getElementById("mes").value - 1; // el - convierte a número automáticamente
            let anyo = document.getElementById("anyo").value;
            let fecha = new Date(anyo, mes, dia);

            document.getElementById("result").innerHTML = formatearFecha(fecha);
        }
    </script>
</body>

</html>
