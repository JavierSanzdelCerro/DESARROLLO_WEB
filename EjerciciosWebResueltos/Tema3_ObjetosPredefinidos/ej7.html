<!DOCTYPE html>
<!--
  TEMA 3 · EJERCICIO 7  (Ejercicios de cadenas)
  ENUNCIADO:
  Crear un script que solicite una cadena y diga si es palíndromo, es decir, se escribe igual de derecha a izquierda y de izquierda a derecha.
  Ejemplo de palíndromo: Allí ves Sevilla.
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tema 3 - Ejercicio 7</title>
</head>

<body>
    <form>
        <br>
        Cadena: <input type="text" id="cadena">
        <input type="submit" value="Enviar" onclick="comprobarPali(); return false;"><br><br>
        <p id="result"></p>
    </form>

    <script>
        // Da la vuelta a un texto: lo parte en letras, invierte el array y lo vuelve a unir
        function reverseString(str) {
            return str.split("").reverse().join("");
        }

        // Deja el texto listo para comparar: minúsculas, sin espacios, sin signos y sin tildes
        // "Allí ves Sevilla." → "allivessevilla"
        function limpiarTexto(texto) {
            texto = texto.toLowerCase();
            // Cada vocal con tilde está en la MISMA posición que su versión sin tilde (á ↔ a, é ↔ e...)
            let conTilde = "áéíóúü";
            let sinTilde = "aeiouu";
            // Caracteres que NO cuentan para el palíndromo
            let ignorar = " .,;:¡!¿?";
            let limpio = "";

            // Recorremos letra a letra y vamos construyendo el texto limpio
            for (let i = 0; i < texto.length; i++) {
                let letra = texto.charAt(i);

                // indexOf da -1 si NO la encuentra → si la encuentra en 'ignorar', nos la saltamos
                if (ignorar.indexOf(letra) !== -1) {
                    continue; // continue salta a la siguiente vuelta del bucle sin añadir nada
                }

                // Si es vocal con tilde, la cambiamos por la de la misma posición en 'sinTilde'
                let pos = conTilde.indexOf(letra);
                if (pos !== -1) {
                    letra = sinTilde.charAt(pos);
                }

                limpio += letra;
            }
            return limpio;
        }

        function comprobarPali() {
            // CORREGIDO: hay que quitar tildes y el punto, si no "Allí ves Sevilla." (el ejemplo) no daba palíndromo
            let texto = limpiarTexto(document.getElementById("cadena").value);

            if (texto == reverseString(texto)) {
                document.getElementById("result").innerHTML = "Es palíndromo";
            } else {
                document.getElementById("result").innerHTML = "No es palíndromo";
            }
        }
    </script>
</body>

</html>
