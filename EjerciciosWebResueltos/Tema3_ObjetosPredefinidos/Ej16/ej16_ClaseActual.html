<!DOCTYPE html>
<!--
  TEMA 3 · EJERCICIO 16  (Ejercicios combinados)
  ENUNCIADO:
  Crea un script que genere un horario similar a este:
  (En el documento aparece una imagen del horario)
  let horario=[ ... mismo array que en ej16.html ... ];
  - Usa un array bidimensional para guardar los datos que vas a mostrar. Sin horas ni días.
  - Usa objetos Date para mostrar las fechas.
  - Las horas de la primera columna, se deben de calcular.

  VARIANTE: resalta la CELDA de la clase que se está dando AHORA MISMO (día de hoy + hora actual) y la escribe debajo.
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tema 3 - Ejercicio 16 (clase actual)</title>
</head>

<body>
    <script>
        let horario = [
            ["IPPE", "PROY", "IPPE", "AD", "SGE"],
            ["DI", "SGE", "AD", "AD", "SGE"],
            ["DI", "SGE", "AD", "AD", "SASP"],
            ["RECREO", "RECREO", "RECREO", "RECREO", "RECREO"],
            ["DWC", "PMDM", "PMDM", "PROY", "DI"],
            ["DWC", "PMDM", "PMDM", "PSP", "DI"],
            ["DWC", "PMDM", "PMDM", "PSP", "DI"]
        ];

        function formatoHora(d) {
            let h = d.getHours();
            let m = d.getMinutes();
            if (h < 10) { h = "0" + h; }
            if (m < 10) { m = "0" + m; }
            return h + ":" + m;
        }

        // Momento actual y columna del día de hoy (lunes = 0 ... viernes = 4)
        let ahora = new Date();
        let columnaHoy = ahora.getDay() - 1;
        // Aquí guardaremos el texto de la clase actual si la encontramos
        let claseActual = "";

        // 'inicio' se crea a partir de HOY, así se puede comparar directamente con 'ahora'
        let inicio = new Date();
        inicio.setHours(15, 45, 0, 0);

        document.write("<table border='1'>");
        document.write("<tr><th></th><th>L</th><th>M</th><th>X</th><th>J</th><th>V</th></tr>");

        for (let f = 0; f < horario.length; f++) {
            let esRecreo = horario[f][0] === "RECREO";
            let duracion = esRecreo ? 15 : 50;

            let fin = new Date(inicio);
            fin.setMinutes(fin.getMinutes() + duracion);

            // PARTE NUEVA: los Date se pueden comparar con < > porque internamente son milisegundos
            let estaEnEstaFranja = ahora >= inicio && ahora < fin;

            document.write("<tr>");
            document.write("<td>" + formatoHora(inicio) + " - " + formatoHora(fin) + "</td>");
            for (let c = 0; c < horario[f].length; c++) {
                // Se resalta solo si coincide la franja Y el día
                if (estaEnEstaFranja && c === columnaHoy) {
                    document.write("<td style='background-color: lightgreen; font-weight: bold;'>" + horario[f][c] + "</td>");
                    claseActual = horario[f][c] + " (" + formatoHora(inicio) + " - " + formatoHora(fin) + ")";
                } else {
                    document.write("<td>" + horario[f][c] + "</td>");
                }
            }
            document.write("</tr>");

            inicio = new Date(fin);
            if (!esRecreo && f + 1 < horario.length && horario[f + 1][0] !== "RECREO") {
                inicio.setMinutes(inicio.getMinutes() + 5);
            }
        }

        document.write("</table>");

        // Mensaje final según si estamos o no en clase
        if (claseActual !== "") {
            document.write("<p>Ahora mismo toca: <b>" + claseActual + "</b></p>");
        } else {
            document.write("<p>Ahora mismo no hay clase (son las " + formatoHora(ahora) + ").</p>");
        }
    </script>
</body>

</html>
