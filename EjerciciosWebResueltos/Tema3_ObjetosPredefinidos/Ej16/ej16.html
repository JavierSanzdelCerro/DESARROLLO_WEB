<!DOCTYPE html>
<!--
  TEMA 3 · EJERCICIO 16  (Ejercicios combinados)
  ENUNCIADO:
  Crea un script que genere un horario similar a este:
  (En el documento aparece una imagen del horario)
  let horario=[
              ["IPPE", "PROY", "IPPE", "AD", "SGE"],
              ["DI", "SGE", "AD", "AD", "SGE"],
              ["DI", "SGE", "AD", "AD", "SASP"],
              ["RECREO","RECREO","RECREO","RECREO","RECREO"],
              ["DWC", "PMDM", "PMDM", "PROY", "DI"],
              ["DWC", "PMDM", "PMDM", "PSP", "DI"],
              ["DWC", "PMDM", "PMDM", "PSP", "DI"]
          ];
  - Usa un array bidimensional para guardar los datos que vas a mostrar. Sin horas ni días.
  - Usa objetos Date para mostrar las fechas.
  - Las horas de la primera columna, se deben de calcular.

  SOLUCIÓN BASE: clases de 50 min desde las 15:45, 5 min entre clases y recreo de 15 min.
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema 3 - Ejercicio 16</title>
</head>

<body>

    <script>
        // Array bidimensional: cada fila es una franja, cada columna un día (L a V)
        let horario = [
            ["IPPE", "PROY", "IPPE", "AD", "SGE"],
            ["DI", "SGE", "AD", "AD", "SGE"],
            ["DI", "SGE", "AD", "AD", "SASP"],
            ["RECREO", "RECREO", "RECREO", "RECREO", "RECREO"],
            ["DWC", "PMDM", "PMDM", "PROY", "DI"],
            ["DWC", "PMDM", "PMDM", "PSP", "DI"],
            ["DWC", "PMDM", "PMDM", "PSP", "DI"]
        ];

        // Devuelve una fecha como texto "HH:MM" (añade un 0 si es menor que 10)
        function formatoHora(d) {
            let h = d.getHours();
            let m = d.getMinutes();
            if (h < 10) { h = "0" + h; }
            if (m < 10) { m = "0" + m; }
            return h + ":" + m;
        }

        // PARTE 1: hora de inicio de la primera clase (15:45) como objeto Date
        let inicio = new Date();
        inicio.setHours(15, 45, 0, 0);

        document.write("<table border='1'>");

        // CORREGIDO: el enunciado pide usar objetos Date para mostrar las FECHAS; antes solo salían las letras
        // Buscamos el LUNES de esta semana: getDay() da 0 = domingo ... 6 = sábado
        // (getDay() + 6) % 7 convierte eso en "días que han pasado desde el lunes" (lunes 0 ... domingo 6)
        let hoy = new Date();
        let lunes = new Date(hoy);
        lunes.setDate(hoy.getDate() - (hoy.getDay() + 6) % 7);

        // Cabecera: celda vacía (columna de horas) + un día por columna con su fecha
        let letrasDias = ["L", "M", "X", "J", "V"];
        document.write("<tr><th></th>");
        for (let d = 0; d < 5; d++) {
            let fechaDia = new Date(lunes);
            // Si al sumar días nos pasamos de fin de mes, Date salta solo al mes siguiente (31/10 + 1 → 1/11)
            fechaDia.setDate(lunes.getDate() + d);
            document.write("<th>" + letrasDias[d] + " " + fechaDia.getDate() + "/" + (fechaDia.getMonth() + 1) + "</th>");
        }
        document.write("</tr>");

        // PARTE 2: recorro las filas del array
        for (let f = 0; f < horario.length; f++) {
            let esRecreo = horario[f][0] === "RECREO";

            // Duración: 15 min el recreo, 50 min las clases
            let duracion;
            if (esRecreo) {
                duracion = 15;
            } else {
                duracion = 50;
            }

            // Hora de fin = inicio + duración (copio la fecha con new Date(inicio))
            let fin = new Date(inicio);
            fin.setMinutes(fin.getMinutes() + duracion);

            // Fila: primero la hora calculada, luego las asignaturas
            document.write("<tr>");
            document.write("<td>" + formatoHora(inicio) + " - " + formatoHora(fin) + "</td>");

            // PARTE 3: recorro las columnas de esa fila
            for (let c = 0; c < horario[f].length; c++) {
                document.write("<td>" + horario[f][c] + "</td>");
            }
            document.write("</tr>");

            // Calculo cuándo empieza la siguiente franja
            inicio = new Date(fin);
            // 5 min de pausa, salvo si acabo de salir del recreo o el siguiente es el recreo
            if (!esRecreo && f + 1 < horario.length && horario[f + 1][0] !== "RECREO") {
                inicio.setMinutes(inicio.getMinutes() + 5);
            }
        }

        document.write("</table>");
    </script>

</body>

</html>
