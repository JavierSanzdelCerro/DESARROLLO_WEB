<!DOCTYPE html>
<!--
  TEMA 3 · EJERCICIO 16  (Ejercicios combinados)
  ENUNCIADO:
  Crea un script que genere un horario similar a este:
  (En el documento aparece una imagen del horario)
  let horario=[ ... mismo array que en ej16.html ... ];
  - Usa un array bidimensional para guardar los datos que vas a mostrar. Sin horas ni días.
  - Usa objetos Date para mostrar las fechas.
  - Las horas de la primera columna, se deben de calcular.

  VARIANTE: cambiar la HORA DE INICIO y la DURACIÓN de las clases y del recreo
  (aquí: empieza a las 08:30, clases de 55 min y recreo de 30 min).
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tema 3 - Ejercicio 16 (otra hora y duración)</title>
</head>

<body>
    <script>
        let horario = [
            ["IPPE", "PROY", "IPPE", "AD", "SGE"],
            ["DI", "SGE", "AD", "AD", "SGE"],
            ["DI", "SGE", "AD", "AD", "SASP"],
            ["RECREO", "RECREO", "RECREO", "RECREO", "RECREO"],
            ["DWC", "PMDM", "PMDM", "PROY", "DI"],
            ["DWC", "PMDM", "PMDM", "PSP", "DI"],
            ["DWC", "PMDM", "PMDM", "PSP", "DI"]
        ];

        // PARTE NUEVA: los datos del horario van en variables al principio.
        // Para cambiar la hora o las duraciones solo se toca aquí; el resto del código es igual que ej16.html
        let horaInicio = 8;
        let minutoInicio = 30;
        let durClase = 55;
        let durRecreo = 30;

        function formatoHora(d) {
            let h = d.getHours();
            let m = d.getMinutes();
            if (h < 10) { h = "0" + h; }
            if (m < 10) { m = "0" + m; }
            return h + ":" + m;
        }

        // La hora de inicio sale de las variables (antes estaba escrito 15, 45)
        let inicio = new Date();
        inicio.setHours(horaInicio, minutoInicio, 0, 0);

        document.write("<table border='1'>");

        // Cabecera con la fecha de cada día de esta semana (igual que ej16.html)
        let hoy = new Date();
        let lunes = new Date(hoy);
        lunes.setDate(hoy.getDate() - (hoy.getDay() + 6) % 7);

        let letrasDias = ["L", "M", "X", "J", "V"];
        document.write("<tr><th></th>");
        for (let d = 0; d < 5; d++) {
            let fechaDia = new Date(lunes);
            fechaDia.setDate(lunes.getDate() + d);
            document.write("<th>" + letrasDias[d] + " " + fechaDia.getDate() + "/" + (fechaDia.getMonth() + 1) + "</th>");
        }
        document.write("</tr>");

        for (let f = 0; f < horario.length; f++) {
            let esRecreo = horario[f][0] === "RECREO";

            // La duración sale de las variables (antes estaba escrito 50 y 15)
            let duracion = durClase;
            if (esRecreo) {
                duracion = durRecreo;
            }

            // setMinutes con más de 59 no da error: Date pasa sola a la hora siguiente (08:30 + 55 → 09:25)
            let fin = new Date(inicio);
            fin.setMinutes(fin.getMinutes() + duracion);

            document.write("<tr>");
            document.write("<td>" + formatoHora(inicio) + " - " + formatoHora(fin) + "</td>");
            for (let c = 0; c < horario[f].length; c++) {
                document.write("<td>" + horario[f][c] + "</td>");
            }
            document.write("</tr>");

            inicio = new Date(fin);
            if (!esRecreo && f + 1 < horario.length && horario[f + 1][0] !== "RECREO") {
                inicio.setMinutes(inicio.getMinutes() + 5);
            }
        }

        document.write("</table>");
    </script>
</body>

</html>
