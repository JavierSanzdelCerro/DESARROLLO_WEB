<!DOCTYPE html>
<!--
  TEMA 3 · EJERCICIO 2  (Ejercicios de arrays)
  ENUNCIADO:
  El cálculo de la letra del Documento Nacional de Identidad (DNI) es un proceso matemático sencillo que se basa en obtener el resto de la división entera del número de DNI y el número 23. Si el resto es 0 será la letra “T”, si es 1 la letra “R”, etc. Se adjunta el array con las letras correspondientes a los restos.
  var letras = ['T', 'R', 'W', 'A', 'G', 'M', 'Y', 'F', 'P', 'D', 'X', 'B', 'N', 'J', 'Z', 'S', 'Q', 'V', 'H', 'L', 'C', 'K', 'E', 'T'];
  Pídele un DNI al usuario e indícale si el DNI introducido es válido o no.
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tema 3 - Ejercicio 2</title>
</head>

<body>
    <form>
        <br>
        DNI (8 números + letra): <input type="text" id="dni" placeholder="12345678Z">
        <!-- return false evita que el formulario se envíe y recargue la página -->
        <input type="submit" value="Comprobar" onclick="comprobarDni(); return false;"><br><br>
        <p id="resultado"></p>
    </form>

    <script>
        function comprobarDni() {
            let letras = ['T', 'R', 'W', 'A', 'G', 'M', 'Y', 'F', 'P', 'D', 'X', 'B', 'N', 'J', 'Z', 'S', 'Q',
                'V', 'H', 'L', 'C', 'K', 'E', 'T'];

            // .value lee lo escrito en el input; trim() quita espacios y toUpperCase() pasa la letra a mayúscula
            let dni = document.getElementById("dni").value.trim().toUpperCase();
            let resultado = document.getElementById("resultado");

            // CORREGIDO: antes solo calculaba la letra; el enunciado pide decir si el DNI es VÁLIDO
            if (dni.length !== 9) {
                resultado.innerHTML = "No válido: debe tener 8 números y 1 letra";
                return;
            }

            // substring(0, 8) = los 8 primeros caracteres; charAt(8) = el noveno (la letra)
            let numero = dni.substring(0, 8);
            let letra = dni.charAt(8);

            // Comprobamos que la parte numérica sean solo cifras
            if (isNaN(numero)) {
                resultado.innerHTML = "No válido: los 8 primeros caracteres deben ser números";
                return;
            }

            // El resto de dividir entre 23 es la posición de la letra correcta en el array
            let letraCorrecta = letras[parseInt(numero) % 23];

            if (letra === letraCorrecta) {
                resultado.innerHTML = "El DNI " + dni + " es VÁLIDO";
            } else {
                resultado.innerHTML = "El DNI NO es válido. La letra correcta sería " + letraCorrecta;
            }
        }
    </script>
</body>

</html>
