<!DOCTYPE html>
<!--
  TEMA 3 · EJERCICIO 5  (Ejercicios de arrays)
  ENUNCIADO:
  Crea un calendario del mes que le pidas al usuario.
  Marca en color rojo los días festivos. Guarda los festivos en un array doble indexado por el número del mes (0 a 11), así:
  Este array nos dice que en enero hay 2 festivos, el 1 Y el 6 de enero. En febrero, ninguno
  Array de festivos de 2025:
          var festivos = [[1,6],[],[],[17,18,23],[1],[],[],[15],[],[12],[1],[6,8,25]];

  VARIANTE: muestra un TÍTULO con el nombre del mes y el año, y marca hoy.
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema 3 - Ejercicio 5</title>
</head>

<body>

    <script>
        // Pido el año y compruebo que es un número
        let anio = parseInt(prompt("Dime un año"));
        while (isNaN(anio)) {
            anio = parseInt(prompt("Año no válido, dime un año"));
        }

        // Pido el mes (1-12) y compruebo que es válido
        let mesUsuario = parseInt(prompt("Dime un mes del año EN NUMERO y te sacaré el calendario de este"));
        while (isNaN(mesUsuario) || mesUsuario > 12 || mesUsuario < 1) {
            mesUsuario = parseInt(prompt("Mes no válido, dime un mes del 1 al 12"));
        }

        // Nombres de los meses (posición 0 = enero ... 11 = diciembre)
        let nombresMeses = [
            "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
            "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
        ];

        // Festivos por mes (posición 0 = enero ... 11 = diciembre)
        let festivos = [
            [1, 6],     // 0 enero
            [],         // 1 febrero
            [],         // 2 marzo
            [3, 23],    // 3 abril
            [1],        // 4 mayo
            [],         // 5 junio
            [],         // 6 julio
            [15],       // 7 agosto
            [],         // 8 septiembre
            [12],       // 9 octubre
            [2],        // 10 noviembre
            [7, 8, 25]  // 11 diciembre
        ];

        let numeroMesParaArray = mesUsuario - 1;   // mes de 0 a 11

        // Fecha de hoy, para marcarla
        let hoy = new Date();

        // Día de la semana en que empieza el mes y huecos antes del día 1
        let fecha = new Date(anio, numeroMesParaArray, 1);
        let primerDiaMes = fecha.getDay();
        let huecos = (primerDiaMes + 6) % 7;

        // Días del mes: día 0 del mes siguiente = último día de este mes
        let diasMes = new Date(anio, mesUsuario, 0).getDate();

        // Título con el nombre del mes y el año
        document.write("<h2>" + nombresMeses[numeroMesParaArray] + " " + anio + "</h2>");

        // Tabla y cabecera
        document.write("<table>");
        document.write("<tr>");
        document.write("<th>L</th>");
        document.write("<th>M</th>");
        document.write("<th>X</th>");
        document.write("<th>J</th>");
        document.write("<th>V</th>");
        document.write("<th>S</th>");
        document.write("<th>D</th>");
        document.write("</tr>");

        // Abro la primera fila de días y escribo los huecos
        document.write("<tr>");
        for (let i = 1; i <= huecos; i++) {
            document.write("<td> </td>");
        }

        // Días del mes
        for (let n = 1; n <= diasMes; n++) {
            // 1º: ¿es hoy? (mismo día, mes y año) → fondo azul
            if (n === hoy.getDate() && numeroMesParaArray === hoy.getMonth() && anio === hoy.getFullYear()) {
                document.write("<td style='background-color: lightblue;'>" + n + "</td>");
            // 2º: ¿es festivo o domingo? → texto rojo
            } else if (festivos[numeroMesParaArray].includes(n) || (huecos + n) % 7 === 0) {
                document.write("<td style='color: red;'>" + n + "</td>");
            // 3º: día normal
            } else {
                document.write("<td>" + n + "</td>");
            }

            // Si la fila llega a 7 casillas, la cierro y abro otra
            if ((huecos + n) % 7 === 0) {
                document.write("</tr><tr>");
            }
        }

        document.write("</tr>");
        document.write("</table>");
    </script>

</body>

</html>
