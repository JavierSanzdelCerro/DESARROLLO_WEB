<!DOCTYPE html>
<!--
  TEMA 4 · EJERCICIO 6
  ENUNCIADO:
  Realizar un programa con dos botones “Comenzar Saludos” y “Parar Saludos”. Al hacer click en “Comenzar Saludos”, lance un setInterval que cada 5 segundos muestre un alert con “Hola”. El botón “Parar Saludos” parará esa secuencia.
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tema 4 - Ejercicio 6</title>
    <script src="ej6.js"></script>
</head>

<body>
    <!-- Aquí los eventos se asignan con el atributo onclick directamente en el HTML -->
    <input type="button" onclick="comenzar();" value="Comenzar Saludos">
    <input type="button" onclick="parar();" value="Parar Saludos">
</body>

</html>
