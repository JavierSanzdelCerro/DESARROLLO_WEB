<!DOCTYPE html>
<!--
  TEMA 4 · EJERCICIO 1
  ENUNCIADO:
  Haz un programa que cuando se pulse un botón “Nuevo número”, añada un elemento con un número aleatorio a una lista desordenada (elemento UL).
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tema 4 - Ejercicio 1</title>
    <!-- El script va en el <head>: por eso dentro usamos window.onload (ver ej1.js) -->
    <script src="ej1.js"></script>
</head>

<body>
    <ul id="miLista">
        <li>Primer elemento</li>
        <li>Segundo elemento</li>
    </ul>
    <input type="button" id="nuevo" value="Nuevo número">
    <!-- Botón extra (no lo pide el enunciado) para practicar removeChild -->
    <input type="button" id="borrar" value="Eliminar último elemento">
</body>

</html>
