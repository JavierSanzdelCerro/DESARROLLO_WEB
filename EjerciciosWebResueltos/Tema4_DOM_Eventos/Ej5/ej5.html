<!DOCTYPE html>
<!--
  TEMA 4 · EJERCICIO 5
  ENUNCIADO:
  Haz un programa que mediante eventos y el uso del objeto event, te muestre en todo momento la posición actual del ratón en pantalla.
  Para mostrarlo modificaremos de forma dinámica un elemento XHTML (Ejemplo, un <p>) que nos muestre la posición actual del ratón.
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tema 4 - Ejercicio 5</title>
    <script src="ej5.js"></script>
    <style>
        /* Para que se pueda mover el ratón por toda la ventana */
        html, body { height: 100%; margin: 0; }
    </style>
</head>

<body>
    <p id="p1">Mueve el ratón...</p>
</body>

</html>
