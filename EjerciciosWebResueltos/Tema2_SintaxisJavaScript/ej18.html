<!DOCTYPE html>
<!--
  TEMA 2 · EJERCICIO 18
  ENUNCIADO:
  Crea un script que dado un número nos muestre por pantalla todos los impares. Nota sin usar operador módulo (%)
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tema 2 - Ejercicio 18</title>
</head>

<body>
    <script>
        let numero = parseInt(prompt("Inserte número:"));

        // CORREGIDO: antes era i < numero y no incluía el propio número si era impar
        for (let i = 1; i <= numero; i++) {
            // Truco sin %: si i/2 NO es entero (7/2 = 3.5), i es impar
            if (!Number.isInteger(i / 2)) {
                document.write(i + " ");
            }
        }
        // OTRA FORMA sin %: empezar en 1 y sumar de 2 en 2 → for (let i = 1; i <= numero; i += 2)
    </script>
</body>

</html>
