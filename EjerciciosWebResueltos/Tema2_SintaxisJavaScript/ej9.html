<!DOCTYPE html>
<!--
  TEMA 2 · EJERCICIO 9
  ENUNCIADO:
  Crea un script en el que el usuario si introduce (C3PO, R2, Vader o luck ) nos responda diciendo que son personajes de Star Wars y si introduce cualquier otro nos responda que no son personajes de la película. Pista: Los datos podrán ser introducidos tanto en minúsculas como en mayúsculas: miCadena.toUppercase();
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tema 2 - Ejercicio 9</title>
</head>

<body>
    <script>
        let personaje = prompt("Dime un personaje de Star Wars");
        // Pasamos a MAYÚSCULAS para que "vader", "Vader" y "VADER" se traten igual
        // (si pulsa Cancelar, prompt devuelve null y null no tiene toUpperCase → lo comprobamos antes)
        if (personaje != null) {
            personaje = personaje.toUpperCase();
        }

        // Los personajes guardados ya en MAYÚSCULAS
        let personajes = ["C3PO", "R2", "VADER", "LUCK"];

        // CORREGIDO: antes el bucle hacía break en el primer fallo y solo reconocía "C3PO"
        // Recorremos TODO el array; si alguno coincide, marcamos la bandera
        let encontrado = false;
        for (let i = 0; i < personajes.length; i++) {
            if (personajes[i] === personaje) {
                encontrado = true;
            }
        }

        if (encontrado) {
            document.write(personaje + " es un personaje de Star Wars");
        } else {
            document.write(personaje + " NO es un personaje de Star Wars");
        }
    </script>
</body>

</html>
