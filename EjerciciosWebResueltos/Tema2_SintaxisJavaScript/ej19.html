<!DOCTYPE html>
<!--
  TEMA 2 · EJERCICIO 19
  ENUNCIADO:
  Crea un script que dado un par de números (filas y columnas) escriba una tabla como la del ejemplo
  Ej filas=4; columnas =5
  (En el documento aparece una imagen de ejemplo: tabla de números aleatorios con la suma de cada fila, de cada columna y el total)
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tema 2 - Ejercicio 19</title>
</head>

<body>
    <script>
        let filas = parseInt(prompt("Inserte número de filas de la tabla:"));
        let columnas = parseInt(prompt("Inserte número de columnas de la tabla:"));

        // Array bidimensional (matriz): un array de 'filas' posiciones, y cada una es otro array de 'columnas'
        let mTabla = new Array(filas);
        for (let i = 0; i < mTabla.length; i++) {
            mTabla[i] = new Array(columnas);
        }

        // La última celda (abajo a la derecha) guardará el TOTAL; la empezamos en 0
        mTabla[filas - 1][columnas - 1] = 0;

        document.write("<section><table border='5px'>");

        for (let i = 0; i < mTabla.length; i++) {
            document.write("<tr style='height:40px'>");
            for (let j = 0; j < mTabla[i].length; j++) {

                if (j == mTabla[i].length - 1 && i != mTabla.length - 1) {
                    // CASO 1: última columna (no última fila) → suma de la fila
                    mTabla[i][j] = 0;
                    for (let k = 0; k < mTabla[i].length - 1; k++) {
                        mTabla[i][j] += mTabla[i][k];
                    }
                    // Esa suma de fila también se acumula en el total
                    mTabla[filas - 1][columnas - 1] += mTabla[i][j];
                    document.write("<td style='width:200px'><center><b>Suma fila " + (i + 1) + ": " + mTabla[i][j] + "</b></center></td>");

                } else if (i == mTabla.length - 1 && j != mTabla[i].length - 1) {
                    // CASO 2: última fila (no última columna) → suma de la columna
                    mTabla[i][j] = 0;
                    for (let l = 0; l < mTabla.length - 1; l++) {
                        mTabla[i][j] += mTabla[l][j];
                    }
                    document.write("<td style='width:200px'><center><b>Suma columna " + (j + 1) + ": " + mTabla[i][j] + "</b></center></td>");

                } else if (i == mTabla.length - 1 && j == mTabla[i].length - 1) {
                    // CASO 3: esquina inferior derecha → total
                    document.write("<td style='width:200px'><center><b><u>Total: " + mTabla[i][j] + "</u></b></center></td>");

                } else {
                    // CASO 4: celda normal → número aleatorio de 0 a 99
                    mTabla[i][j] = Math.floor(Math.random() * 100);
                    document.write("<td style='width:200px'><center>" + mTabla[i][j] + "</center></td>");
                }
            }
            document.write("</tr>");
        }
        document.write("</table></section>");
    </script>
</body>

</html>
