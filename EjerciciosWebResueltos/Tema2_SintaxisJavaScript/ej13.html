<!DOCTYPE html>
<!--
  TEMA 2 · EJERCICIO 13
  ENUNCIADO:
  Crea un script que pida un número y nos muestre la siguiente estructura hasta el impar más próximo al número.
  Ej. para número = 8
  ***1***
  **333**
  *55555*
  7777777
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tema 2 - Ejercicio 13</title>
</head>

<body>
    <script>
        let numero = parseInt(prompt("Dime un número"));

        // Si es par, bajamos al impar anterior (8 → 7)
        if (numero % 2 == 0) {
            numero--;
        }

        document.write("<p>");
        // i va de impar en impar: 1, 3, 5, 7...
        for (let i = 1; i <= numero; i += 2) {
            // Asteriscos a la izquierda: (ancho total - números de la fila) / 2
            for (let j = 0; j < (numero - i) / 2; j++) {
                document.write("*");
            }
            // El número i se escribe i veces
            for (let j = 0; j < i; j++) {
                document.write(i);
            }
            // Mismos asteriscos a la derecha para que quede simétrico
            for (let j = 0; j < (numero - i) / 2; j++) {
                document.write("*");
            }
            document.write("<br>");
        }
        document.write("</p>");
    </script>
</body>

</html>
